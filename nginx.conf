server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Force www (Railway terminates TLS; only the host redirect is needed here)
    if ($host = 'first-batterycenter.co.za') {
        return 301 https://www.first-batterycenter.co.za$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /data/vehicles.json {
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
